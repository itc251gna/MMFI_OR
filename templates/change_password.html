{% extends "base.html" %}
{% block title %}Αλλαγή Κωδικού - MMFI{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="mb-3">
            <h1 class="page-title">Αλλαγή κωδικού</h1>
        </div>
        <div class="card">
            <div class="card-body">
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Παλιός κωδικός</label>
                        <input class="form-control" type="password" name="old_password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Νέος κωδικός</label>
                        <input class="form-control" type="password" name="new_password" minlength="8" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Επιβεβαίωση</label>
                        <input class="form-control" type="password" name="confirm_password" minlength="8" required>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary" type="submit">Αποθήκευση</button>
                        <a class="btn btn-outline-secondary" href="{{ url_for('index') }}">Άκυρο</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
